name: Validate AulaGuard Source and Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "docs/**"
      - "build/**"
      - "installer/**"
      - ".github/workflows/build-installer.yml"
      - ".github/workflows/release-verified.yml"

concurrency:
  group: aula-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $files = Get-ChildItem -Path .\src,.\build,.\tests -Include *.ps1,*.psm1 -Recurse
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($file.FullName)::$($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: Verify cryptographic security and tamper resistance
        shell: powershell
        run: .\tests\Security.Tests.ps1

      - name: Validate USB configuration and future Premium boundary
        shell: powershell
        run: .\tests\Usb.Tests.ps1

      - name: Test Windows installed-app inventory
        shell: powershell
        run: .\tests\InstalledApps.Tests.ps1

      - name: Validate readable institutional wallpaper and recoverability
        shell: powershell
        run: .\tests\Wallpaper.Tests.ps1

      - name: Test imported profiles and protected UI actions
        shell: powershell
        run: .\tests\FunctionalWorkflows.Tests.ps1

      - name: Validate professional readiness and preflight logic
        shell: powershell
        run: .\tests\ProfessionalReadiness.Tests.ps1

      - name: Validate isolated policy application and reversal
        shell: powershell
        run: .\tests\PolicyLab.Tests.ps1

      - name: Validate Windows E2E laboratory harness safeguards
        shell: powershell
        run: .\tests\EndToEndHarness.Tests.ps1

      - name: Validate professional responsive interface
        shell: powershell
        run: .\tests\ProfessionalUi.Tests.ps1

      - name: Validate expiring maintenance mode
        shell: powershell
        run: .\tests\Maintenance.Tests.ps1

      - name: Verify installer elevated launch and versions
        shell: powershell
        run: .\tests\InstallerElevatedLaunch.Tests.ps1

      - name: Verify signed-release policy is enforced
        shell: powershell
        run: .\tests\ReleaseSecurity.Tests.ps1

      - name: Generate application icon
        shell: powershell
        run: .\build\GenerateIcon.ps1

      - name: Generate installer branding
        shell: powershell
        run: .\build\GenerateBranding.ps1

      - name: Build AulaGuard.exe
        shell: powershell
        run: .\build\Build-App.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ".\installer\AulaGuard.iss"

      - name: Smoke test protected Windows installation
        shell: powershell
        run: |
          $setup = (Resolve-Path 'dist/installer/AulaGuard-Setup-v0.5.1.exe').Path
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with $($process.ExitCode)" }
          $installedRoot = Join-Path $env:ProgramFiles 'AulaGuard'
          if (-not (Test-Path (Join-Path $installedRoot 'src/AulaGuard.exe'))) {
            throw 'Expected executable missing from Program Files.'
          }
          Import-Module (Join-Path $installedRoot 'src/AulaGuard.Security.psm1') -Force
          Import-Module (Join-Path $installedRoot 'src/AulaGuard.Core.psm1') -Force
          Import-Module (Join-Path $installedRoot 'src/AulaGuard.USB.psm1') -Force
          Import-Module (Join-Path $installedRoot 'src/AulaGuard.InstalledApps.psm1') -Force
          $dataRoot = Join-Path $env:ProgramData 'AulaGuard'
          $settings = Read-AulaGuardSettings -Root $dataRoot
          if ($settings.policyMode -ne 'Audit') { throw 'Fresh installation is not in Audit mode.' }
          $task = Get-ScheduledTask -TaskName 'PolicySync' -TaskPath '\AulaGuard\' -ErrorAction Stop
          $logonTask = Get-ScheduledTask -TaskName 'PolicySyncLogon' -TaskPath '\AulaGuard\' -ErrorAction Stop
          if (-not $logonTask) { throw 'Policy sync at logon is missing.' }
          if (-not $task) { throw 'SYSTEM policy synchronization task missing.' }
          Write-Host '[OK] Protected installer smoke test passed'

      - name: Validate GUI startup bootstrap and PowerShell recovery launcher
        shell: powershell
        run: |
          $installedRoot = Join-Path $env:ProgramFiles 'AulaGuard\src'
          foreach ($file in @('AulaGuard.exe', 'AulaGuard.ps1', 'AulaGuard.Launcher.ps1', 'AulaGuard.Core.psm1', 'AulaGuard.Security.psm1', 'AulaGuard.USB.psm1', 'AulaGuard.InstalledApps.psm1', 'AulaGuard.Wallpaper.psm1', 'AulaGuard.Maintenance.psm1')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installedRoot $file) -PathType Leaf)) {
              throw "Required application or recovery file missing from installation: $file"
            }
          }
          $source = Get-Content -LiteralPath (Join-Path $installedRoot 'AulaGuard.ps1') -Raw -Encoding UTF8
          if ($source -notmatch 'GetCurrentProcess\(\)\.MainModule\.FileName' -or
              $source -notmatch 'Import-Module -Name \$modulePath') {
            throw 'Compiled bootstrap does not resolve and validate application modules from executable path.'
          }
          $env:AULAGUARD_EXE_SELFTEST = '1'
          try {
            & powershell.exe -NoProfile -STA -ExecutionPolicy RemoteSigned -File (Join-Path $installedRoot 'AulaGuard.ps1')
            if ($LASTEXITCODE -ne 0) {
              $log = Join-Path $env:TEMP 'AulaGuard-startup-error.txt'
              if (Test-Path $log) { Get-Content $log | Write-Host }
              throw "PowerShell startup bootstrap failed, exit=$LASTEXITCODE"
            }
          } finally {
            Remove-Item Env:\AULAGUARD_EXE_SELFTEST -ErrorAction SilentlyContinue
          }
          Write-Host '[OK] Installed PowerShell startup passes protected bootstrap checks.'
          Write-Host '[OK] Production EXE build uses embedded path bootstrap; PowerShell fallback is installed.'
          # Do not attempt UAC GUI automation on headless GitHub Actions runners.

      - name: Construct complete AulaGuard USB/Premium interface on Windows
        shell: powershell
        run: |
          $installed = Join-Path $env:ProgramFiles 'AulaGuard\src\AulaGuard.ps1'
          $env:AULAGUARD_UI_SELFTEST = '1'
          try {
            & powershell.exe -NoProfile -STA -ExecutionPolicy RemoteSigned -File $installed
            if ($LASTEXITCODE -ne 0) {
              $log = Join-Path $env:TEMP 'AulaGuard-startup-error.txt'
              if (Test-Path $log) { Get-Content $log | Write-Host }
              throw "AulaGuard GUI initialization failed, exit $LASTEXITCODE"
            }
          } finally { Remove-Item Env:\AULAGUARD_UI_SELFTEST -ErrorAction SilentlyContinue }
          Write-Host '[OK] Full WinForms screen tree built without showing modal windows.'

      - name: Record SHA-256 installer checksum
        shell: powershell
        run: |
          $exe = 'dist/installer/AulaGuard-Setup-v0.5.1.exe'
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AulaGuard-Setup-v0.5.1.exe" | Set-Content dist/installer/SHA256SUMS.txt -Encoding ASCII

      # Experimental and short-lived: do not publish a release.
      # Only emit a downloadable artifact when Defender is actively protecting
      # the Windows builder and a scan of both binaries succeeds.
      - name: Scan trial binaries with active Microsoft Defender
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled) {
            throw 'Cannot distribute test executables: Microsoft Defender is not active on this build runner.'
          }
          $paths = @('dist/AulaGuard.exe','dist/installer/AulaGuard-Setup-v0.5.1.exe')
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Binary not found: $path" }
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $path).Path -ErrorAction Stop
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Defender removed $path" }
          }
          $detections = @(Get-MpThreatDetection -ErrorAction Stop |
            Where-Object { @($_.Resources) -match 'AulaGuard' })
          if ($detections.Count -gt 0) {
            throw 'Defender reported threat detections associated with AulaGuard. No artifact will be published.'
          }
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (-not $status.RealTimeProtectionEnabled) { throw 'Defender real-time protection is not active.' }
          'PRUEBA EXCLUSIVAMENTE EN VM WINDOWS 10/11 PRO. NO USAR EN AULAS EN PRODUCCION.' |
            Set-Content -LiteralPath dist/installer/LEER-ANTES-DE-INSTALAR.txt -Encoding UTF8
          'Sin firma Authenticode de distribucion. No desactivar Microsoft Defender ni evadir SmartScreen.' |
            Add-Content -LiteralPath dist/installer/LEER-ANTES-DE-INSTALAR.txt -Encoding UTF8
          'Compilacion experimental, sin garantia de funcionamiento. Capturar logs de error para diagnostico.' |
            Add-Content -LiteralPath dist/installer/LEER-ANTES-DE-INSTALAR.txt -Encoding UTF8

      - name: Upload scanned AulaGuard test installer (not public release)
        uses: actions/upload-artifact@v4
        with:
          name: AulaGuard-EXE-PRUEBA-NO-FIRMADO
          path: |
            dist/AulaGuard.exe
            dist/installer/AulaGuard-Setup-v0.5.1.exe
            dist/installer/SHA256SUMS.txt
            dist/installer/LEER-ANTES-DE-INSTALAR.txt
          if-no-files-found: error
          retention-days: 3

      - name: Verify Windows uninstallation and residual cleanup
        shell: powershell
        run: .\tests\Uninstall.Tests.ps1

