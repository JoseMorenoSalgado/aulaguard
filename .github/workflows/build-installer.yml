name: Build AulaGuard Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - "docs/**"
      - "build/**"
      - "installer/**"
      - ".github/workflows/build-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $files = Get-ChildItem .\src -Include *.ps1,*.psm1 -Recurse
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($file.FullName)::$($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: Generate application icon
        shell: powershell
        run: .\build\GenerateIcon.ps1

      - name: Generate installer branding
        shell: powershell
        run: .\build\GenerateBranding.ps1

      - name: Build AulaGuard.exe
        shell: powershell
        run: .\build\Build-App.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ".\installer\AulaGuard.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AulaGuard-Windows-Installer
          path: dist/installer/AulaGuard-Setup-v0.3.2.exe
          if-no-files-found: error
