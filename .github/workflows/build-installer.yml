name: Build AulaGuard Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "docs/**"
      - "build/**"
      - "installer/**"
      - ".github/workflows/build-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $files = Get-ChildItem -Path .\src,.\build,.\tests -Include *.ps1,*.psm1 -Recurse
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($file.FullName)::$($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: Verify cryptographic security and tamper resistance
        shell: powershell
        run: .\tests\Security.Tests.ps1

      - name: Generate application icon
        shell: powershell
        run: .\build\GenerateIcon.ps1

      - name: Generate installer branding
        shell: powershell
        run: .\build\GenerateBranding.ps1

      - name: Build AulaGuard.exe
        shell: powershell
        run: .\build\Build-App.ps1

      - name: Sign application when trusted certificate is configured
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          AULAGUARD_PFX_BASE64: ${{ secrets.AULAGUARD_PFX_BASE64 }}
          AULAGUARD_PFX_PASSWORD: ${{ secrets.AULAGUARD_PFX_PASSWORD }}
        run: .\build\Sign-Artifact.ps1 -Path .\dist\AulaGuard.exe

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ".\installer\AulaGuard.iss"

      - name: Sign installer when trusted certificate is configured
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          AULAGUARD_PFX_BASE64: ${{ secrets.AULAGUARD_PFX_BASE64 }}
          AULAGUARD_PFX_PASSWORD: ${{ secrets.AULAGUARD_PFX_PASSWORD }}
        run: .\build\Sign-Artifact.ps1 -Path .\dist\installer\AulaGuard-Setup-v0.3.3.exe

      - name: Record SHA-256 installer checksum
        shell: powershell
        run: |
          $exe = 'dist/installer/AulaGuard-Setup-v0.3.3.exe'
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AulaGuard-Setup-v0.3.3.exe" | Set-Content dist/installer/SHA256SUMS.txt -Encoding ASCII

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AulaGuard-Windows-Installer
          path: |
            dist/installer/AulaGuard-Setup-v0.3.3.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error
