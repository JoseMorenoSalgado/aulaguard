name: Build AulaGuard Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "docs/**"
      - "build/**"
      - "installer/**"
      - ".github/workflows/build-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $files = Get-ChildItem -Path .\src,.\build,.\tests -Include *.ps1,*.psm1 -Recurse
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($file.FullName)::$($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: Verify cryptographic security and tamper resistance
        shell: powershell
        run: .\tests\Security.Tests.ps1

      - name: Generate application icon
        shell: powershell
        run: .\build\GenerateIcon.ps1

      - name: Generate installer branding
        shell: powershell
        run: .\build\GenerateBranding.ps1

      - name: Build AulaGuard.exe
        shell: powershell
        run: .\build\Build-App.ps1

      - name: Sign application when trusted certificate is configured
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          AULAGUARD_PFX_BASE64: ${{ secrets.AULAGUARD_PFX_BASE64 }}
          AULAGUARD_PFX_PASSWORD: ${{ secrets.AULAGUARD_PFX_PASSWORD }}
        run: .\build\Sign-Artifact.ps1 -Path .\dist\AulaGuard.exe

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ".\installer\AulaGuard.iss"

      - name: Smoke test protected Windows installation
        shell: powershell
        run: |
          $setup = (Resolve-Path 'dist/installer/AulaGuard-Setup-v0.3.4.exe').Path
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with $($process.ExitCode)" }
          $installedRoot = Join-Path $env:ProgramFiles 'AulaGuard'
          if (-not (Test-Path (Join-Path $installedRoot 'src/AulaGuard.exe'))) {
            throw 'Expected executable missing from Program Files.'
          }
          Import-Module (Join-Path $installedRoot 'src/AulaGuard.Security.psm1') -Force
          Import-Module (Join-Path $installedRoot 'src/AulaGuard.Core.psm1') -Force
          $dataRoot = Join-Path $env:ProgramData 'AulaGuard'
          $settings = Read-AulaGuardSettings -Root $dataRoot
          if ($settings.policyMode -ne 'Audit') { throw 'Fresh installation is not in Audit mode.' }
          $task = Get-ScheduledTask -TaskName 'PolicySync' -TaskPath '\AulaGuard\' -ErrorAction Stop
          if (-not $task) { throw 'SYSTEM policy synchronization task missing.' }
          Write-Host '[OK] Protected installer smoke test passed'

      - name: Sign installer when trusted certificate is configured
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          AULAGUARD_PFX_BASE64: ${{ secrets.AULAGUARD_PFX_BASE64 }}
          AULAGUARD_PFX_PASSWORD: ${{ secrets.AULAGUARD_PFX_PASSWORD }}
        run: .\build\Sign-Artifact.ps1 -Path .\dist\installer\AulaGuard-Setup-v0.3.4.exe

      - name: Record SHA-256 installer checksum
        shell: powershell
        run: |
          $exe = 'dist/installer/AulaGuard-Setup-v0.3.4.exe'
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AulaGuard-Setup-v0.3.4.exe" | Set-Content dist/installer/SHA256SUMS.txt -Encoding ASCII

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AulaGuard-Windows-Installer
          path: |
            dist/installer/AulaGuard-Setup-v0.3.4.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error


  release:
    name: Publish downloadable installer
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source and version
        uses: actions/checkout@v4

      - name: Download tested Windows installer
        uses: actions/download-artifact@v4
        with:
          name: AulaGuard-Windows-Installer
          path: release

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define MyAppVersion "\([^"]*\)"/\1/p' installer/AulaGuard.iss)"
          if [[ -z "$version" ]]; then
            echo "::error::No se pudo leer la versión del instalador."
            exit 1
          fi
          tag="v${version}"
          installer="release/AulaGuard-Setup-v${version}.exe"
          test -s "$installer"
          test -s release/SHA256SUMS.txt
          (cd release && sha256sum --check SHA256SUMS.txt)

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La versión $tag ya tiene una publicación. No se reemplazan binarios existentes."
            exit 0
          fi

          cat > RELEASE_NOTES.md <<EOF
          ## AulaGuard v${version} — Control de aulas Windows

          Instalador para Windows 10/11 Pro con asistente en español.

          Esta versión incorpora autenticación HMAC-SHA-256 para la configuración y bitácora,
          protección DPAPI de clave local y permisos NTFS restrictivos.

          Descargue **AulaGuard-Setup-v${version}.exe** y ejecútelo como administrador.
          Antes de actualizar una versión previa, revise docs/SECURITY.md para migrar la
          configuración. Pruebe el bloqueo AppLocker en una sola PC primero.

          **Seguridad:** El checksum SHA-256 permite comprobar integridad, pero no certifica
          la identidad del editor. Si el archivo no tiene una firma Authenticode válida,
          Windows puede presentar una advertencia de editor desconocido.
          EOF

          gh release create "$tag" "$installer" release/SHA256SUMS.txt \
            --title "AulaGuard $tag" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            --latest
          gh release view "$tag" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
